[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forgerl"
version = "0.1.0.dev0"
description = "An extensible, policy-version-aware runtime for LLM reinforcement learning"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "qygsCu" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgerl*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
show_error_codes = true
files = ["src"]
